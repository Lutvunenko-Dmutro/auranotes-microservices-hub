<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід — Aura Notes</title>
    <link rel="stylesheet" href="../css/Styles.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
                <div class="logo-icon">A</div>
                <div>
                    <div class="logo-title">Aura Notes</div>
                    <div style="font-size: 12px; color: var(--text-muted);">Microservices SaaS Platform</div>
                </div>
            </div>

            <h1>З поверненням</h1>
            <p class="subtitle">Введіть свої дані для доступу до хмарного блокнота.</p>

            <div id="alertBox" style="display: none;" class="alert alert-danger"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Ім'я користувача</label>
                    <input type="text" id="username" placeholder="alex_dev" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary" style="margin-top: 10px;">
                    Увійти в систему →
                </button>
            </form>

            <div style="margin-top: 24px; text-align: center; font-size: 14px; color: var(--text-secondary);">
                Ще немає акаунту? <a href="register.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Зареєструватися</a>
            </div>

            <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--panel-border); text-align: center;">
                <a href="../Microservices Example/microservices.html" target="_blank" style="font-size: 12px; color: var(--text-muted); text-decoration: none;">
                    ⚙️ Відкрити пульт тестування мікросервісів ↗
                </a>
            </div>
        </div>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
