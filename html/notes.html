<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мої Нотатки — Aura Notes</title>
    <link rel="stylesheet" href="../css/Styles.css">
</head>
<body>

    <div class="app-container">
        <!-- Navigation Bar -->
        <nav class="navbar">
            <a href="notes.html" class="logo-group">
                <div class="logo-icon">A</div>
                <div class="logo-title">Aura Notes</div>
            </a>

            <div class="user-nav">
                <div class="user-badge">
                    <span>👤 <span id="currentUser">Користувач</span></span>
                    <span id="userPlanBadge" class="plan-pill">FREE</span>
                </div>

                <a href="subscriptions.html" class="btn btn-secondary" style="font-size: 13px; padding: 8px 14px;">
                    ⚡ Тарифи
                </a>

                <a href="../Microservices Example/microservices.html" target="_blank" class="btn btn-secondary" style="font-size: 13px; padding: 8px 14px;">
                    ⚙️ Hub ↗
                </a>

                <button id="logoutBtn" class="btn btn-danger" style="font-size: 13px; padding: 8px 14px;">
                    Вийти
                </button>
            </div>
        </nav>

        <!-- Main Content -->
        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 28px; align-items: start;">
            
            <!-- Create Note Card -->
            <div class="auth-card" style="max-width: 100%; padding: 28px;">
                <h2>✏️ Нова нотатка</h2>
                <p class="subtitle" style="margin-bottom: 16px;">Запишіть думку, завдання або ідею.</p>

                <div class="form-group">
                    <label for="noteCategory">Категорія</label>
                    <select id="noteCategory">
                        <option value="💡 Ідеї">💡 Ідеї</option>
                        <option value="💼 Робота">💼 Робота</option>
                        <option value="🎯 Завдання">🎯 Завдання</option>
                        <option value="🌟 Особисте">🌟 Особисте</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="noteInput">Зміст нотатки</label>
                    <textarea id="noteInput" placeholder="Почніть писати тут..."></textarea>
                </div>

                <button id="addNoteBtn" class="btn btn-primary">
                    + Зберегти нотатку
                </button>

                <div id="planLimitNotice" style="margin-top: 16px; font-size: 12px; color: var(--text-muted); text-align: center;">
                    Ліміт: <span id="notesCount">0</span> / <span id="notesLimit">5</span> нотаток
                </div>
            </div>

            <!-- Notes List Section -->
            <div>
                <div class="notes-header-bar">
                    <div>
                        <h2>Моя колекція (<span id="totalNotesHeader">0</span>)</h2>
                    </div>

                    <div class="search-bar">
                        <input type="text" id="searchInput" placeholder="🔍 Пошук за текстом нотаток...">
                    </div>
                </div>

                <div id="notesList" class="notes-grid">
                    <!-- Note items dynamically rendered here -->
                </div>

                <div id="emptyState" style="display: none; text-align: center; padding: 60px 20px; background: var(--panel-bg); border-radius: var(--radius-lg); border: 1px dashed var(--panel-border);">
                    <div style="font-size: 40px; margin-bottom: 12px;">📝</div>
                    <h3>Нотаток поки немає</h3>
                    <p style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">Створіть свою першу нотатку через форму ліворуч!</p>
                </div>
            </div>

        </div>
    </div>

    <script src="../js/notes.js"></script>
</body>
</html>
